<text fill="currentColor" x="271" y="321" text-anchor="middle" font-size="16" font-weight="600">Argmax</text>
<text fill="currentColor" x="271" y="341" text-anchor="middle" font-size="14" font-weight="400" fill-opacity="0.7">best step r*</text>
<path d="M271 356 V389" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow-pitch-head-tall)"/>
<rect x="186" y="392" width="170" height="60" rx="7" fill="#c58ae0" fill-opacity="0.14" stroke="#c58ae0" stroke-width="1.5"/>
<text fill="currentColor" x="271" y="417" text-anchor="middle" font-size="16" font-weight="600">Softmax</text>
<text fill="currentColor" x="271" y="437" text-anchor="middle" font-size="14" font-weight="400" fill-opacity="0.7">over r* − 1, r*, r* + 1</text>
<path d="M271 452 V485" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow-pitch-head-tall)"/>
<rect x="186" y="488" width="170" height="60" rx="7" fill="#c58ae0" fill-opacity="0.14" stroke="#c58ae0" stroke-width="1.5"/>
<text fill="currentColor" x="271" y="513" text-anchor="middle" font-size="16" font-weight="600">Weighted mean</text>
<text fill="currentColor" x="271" y="533" text-anchor="middle" font-size="14" font-weight="400" fill-opacity="0.7">of log f, then exp</text>
<path d="M271 548 V581" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrow-pitch-head-tall)"/>
<text fill="currentColor" x="281" y="574" text-anchor="start" font-size="14" font-weight="400" fill-opacity="0.7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">pitch [T]</text>
<text fill="currentColor" x="40" y="160" text-anchor="middle" font-size="14" font-weight="600">training</text>
<text fill="currentColor" x="320" y="160" text-anchor="middle" font-size="14" font-weight="600">inference</text>
